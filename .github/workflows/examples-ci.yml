name: Examples CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "bun.lockb"
      - "examples/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "bun.lockb"
      - "examples/**"

jobs:
  examples:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build keyless example
        working-directory: examples/keyless-example
        run: bun run build

      - name: Lint keyless example
        working-directory: examples/keyless-example
        run: bun run lint

      - name: Build federated keyless example
        working-directory: examples/federated-keyless-example
        run: bun run build

      - name: Lint federated keyless example
        working-directory: examples/federated-keyless-example
        run: bun run lint
